// Z4L password-only login with encrypted Firebase Realtime Database vault sync.
const KEY='z4l_app_data_v1'; const DBURL='https://z4l0-f2849-default-rtdb.firebaseio.com/'; const CLOUD_PATH='z4lEncryptedVault';
let syncState={password:null,key:null,salt:null,remoteUpdatedAt:0,lastLocalWrite:0,active:false,poll:null,busy:false};
function cloudEndpoint(){return DBURL+CLOUD_PATH+'.json'}
function randomBytes(n){const b=new Uint8Array(n);crypto.getRandomValues(b);return b}
function b64(bytes){return btoa(String.fromCharCode(...bytes))}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function deriveKey(password,salt){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptVault(obj,password,saltBytes=null){const salt=saltBytes||randomBytes(16),iv=randomBytes(12),key=await deriveKey(password,salt);const plain=new TextEncoder().encode(JSON.stringify(obj));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);return {schema:1,salt:b64(salt),iv:b64(iv),ciphertext:b64(new Uint8Array(cipher)),updatedAt:Date.now()}}
async function decryptVault(v,password){const salt=fromB64(v.salt),iv=fromB64(v.iv),key=await deriveKey(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,fromB64(v.ciphertext));return {data:JSON.parse(new TextDecoder().decode(plain)),key,salt}}
async function fetchVault(){const r=await fetch(cloudEndpoint(),{cache:'no-store'});if(!r.ok)throw new Error('Firebase GET '+r.status);return r.json()}
async function putVault(obj,password,salt){const encrypted=await encryptVault(obj,password,salt);const r=await fetch(cloudEndpoint(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(encrypted)});if(!r.ok)throw new Error('Firebase PUT '+r.status);syncState.remoteUpdatedAt=encrypted.updatedAt;syncState.salt=fromB64(encrypted.salt);syncState.lastLocalWrite=encrypted.updatedAt;setSyncLabel('تمت المزامنة الآن ♡');return encrypted}
function setSyncLabel(msg){const el=document.getElementById('syncStatus');if(el)el.textContent=msg}
async function activatePasswordSync(password){setSyncLabel('جارٍ تحميل البيانات السحابية…');const remote=await fetchVault();if(remote&&remote.ciphertext){try{const decrypted=await decryptVault(remote,password);data=decrypted.data;syncState.key=decrypted.key;syncState.salt=decrypted.salt;syncState.remoteUpdatedAt=remote.updatedAt||0;localStorage.setItem(KEY,JSON.stringify(data));setSyncLabel('تم تحميل بياناتك المشفرة من Firebase ♡');}catch(e){throw new Error('كلمة المرور غير صحيحة أو تعذر فك بيانات المزامنة.')}}else{syncState.key=await deriveKey(password,randomBytes(16));syncState.salt=randomBytes(16);await putVault(data,password,syncState.salt);setSyncLabel('تم إنشاء مساحة السحابة ومزامنتها ♡')}syncState.password=password;syncState.active=true;startCloudPolling();unlock();return true}
async function cloudWrite(){if(!syncState.active||!syncState.password)return;try{await putVault(data,syncState.password,syncState.salt)}catch(err){setSyncLabel('تعذر الاتصال — البيانات محفوظة محليًا مؤقتًا')}}
function startCloudPolling(){if(syncState.poll)clearInterval(syncState.poll);syncState.poll=setInterval(async()=>{if(!syncState.active||syncState.busy)return;syncState.busy=true;try{const remote=await fetchVault();if(remote&&remote.ciphertext&&remote.updatedAt>syncState.remoteUpdatedAt){const dec=await decryptVault(remote,syncState.password);data=dec.data;syncState.salt=dec.salt;syncState.remoteUpdatedAt=remote.updatedAt;localStorage.setItem(KEY,JSON.stringify(data));if(!document.getElementById('app').hidden)render();setSyncLabel('تم تحديث البيانات من جهاز آخر ♡')}}catch(e){setSyncLabel('المزامنة غير متاحة حاليًا؛ نحتفظ بالبيانات محليًا')}finally{syncState.busy=false}},12000)}

let data=loadData(),page='home',calMonth=new Date().getMonth(),calYear=new Date().getFullYear(),selectedDay=new Date().toISOString().slice(0,10),currentPhase='';function loadData(){try{return JSON.parse(localStorage.getItem(KEY))||{cycles:[],logs:{},reminders:[],profile:{name:''}}}catch(e){return {cycles:[],logs:{},reminders:[],profile:{name:''}}}}function persist(){localStorage.setItem(KEY,JSON.stringify(data));syncState.lastLocalWrite=Date.now();cloudWrite();toast(syncState.active?'تم حفظ البيانات وبدء المزامنة ♡':'تم حفظ البيانات على الجهاز ♡')}function todayKey(){return new Date().toISOString().slice(0,10)}function dateFmt(d){return new Intl.DateTimeFormat('ar',{day:'numeric',month:'long',year:'numeric'}).format(d)}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}

function lastCycle(){return [...data.cycles].sort((a,b)=>b.start.localeCompare(a.start))[0]}function avgCycle(){const cs=[...data.cycles].sort((a,b)=>a.start.localeCompare(b.start));if(cs.length<2)return 28;let dif=[];for(let i=1;i<cs.length;i++)dif.push((new Date(cs[i].start)-new Date(cs[i-1].start))/86400000);return Math.round(dif.reduce((a,b)=>a+b,0)/dif.length)}function phaseInfo(){let c=lastCycle();if(!c)return null;let length=avgCycle(),start=new Date(c.start+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);let day=Math.floor((now-start)/86400000)+1;if(day<1)return {day:1,phase:'قبل الدورة',remaining:Math.max(0,length),cycleLength:length};let n=((day-1)%length)+1;let periodLen=c.end?Math.max(1,Math.round((new Date(c.end+'T12:00:00')-start)/86400000)+1):5;let ov=Math.max(1,length-14);let phase=n<=periodLen?'مرحلة الحيض':n<ov?'المرحلة الجُريبية':n===ov?'الإباضة المقدرة':'المرحلة الأصفرية';return {day:n,phase,remaining:length-n,cycleLength:length,periodLen,ovulationDay:ov}}function allLogs(){return Object.entries(data.logs||{}).sort((a,b)=>a[0].localeCompare(b[0]))}function nav(pageName){page=pageName;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===pageName));render()}

function stageInfo(name){currentPhase=name;const info={'الحيض':'خلال الحيض يطرح الجسم بطانة الرحم. قد يرافقه نزيف وتقلصات أو تعب.','الجُريبية':'في هذه المرحلة تنمو الجريبات، وقد تتغير الطاقة أو الأعراض.','الإباضة':'وقت الإباضة يختلف، وتوقعه من التقويم وحده غير دقيق.','الأصفرية':'بعد الإباضة تتغير الهرمونات استعدادًا لبداية دورة جديدة إذا لم يحدث حمل.'};toast(info[name]||name)}

function journalPage(c,k){let log=data.logs[k]||{};c.innerHTML=`<h1 class="page-title">Daily Check-in</h1><p class="page-sub">سجّلي كيف كان يومك، بكل لطف وبدون أحكام.</p><div class="card"><div class="field" style="margin-bottom:18px"><label>التاريخ</label><input type="date" id="logDate" value="${k}"></div><div class="field" style="margin-bottom:17px"><label>كيف تشعرين اليوم؟</label><div class="pillgroup" id="moodPills">${moods.map(m=>`<button class="pill ${log.mood===m?'selected':''}" onclick="pickMood('${m}')">${m}</button>`).join('')}</div></div><div class="field" style="margin-bottom:17px"><label>الأعراض (اختاري ما ينطبق)</label><div class="symptoms" id="symptomChoices">${symptomsList.map(s=>`<button class="symptom ${log.symptoms?.includes(s)?'selected':''}" onclick="toggleSymptom(this,'${s}')">${s}</button>`).join('')}</div></div><div class="formgrid"><div class="field"><label>شدة الألم: <span id="painLabel">${log.pain??0}/10</span></label><div class="range-row"><input id="pain" type="range" min="0" max="10" value="${log.pain??0}" oninput="painLabel.textContent=this.value+'/10'" style="flex:1"><div class="rangeval" id="painBubble">${log.pain??0}</div></div></div><div class="field"><label>مستوى الطاقة</label><select id="energy"><option value="">اختاري</option>${['منخفض جدًا','منخفض','متوسط','مرتفع','مرتفع جدًا'].map(x=>`<option ${log.energy===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>النزيف</label><select id="flow"><option value="">اختاري</option>${['لا يوجد','خفيف','متوسط','غزير'].map(x=>`<option ${log.flow===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>النوم (اختياري)</label><select id="sleep"><option value="">اختاري</option>${['سيئ','متوسط','جيد','جيد جدًا'].map(x=>`<option ${log.sleep===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>ملاحظاتك</label><textarea id="notes" placeholder="كيف كان يومك؟">${log.notes||''}</textarea></div></div><div c function openCycleModal(editId=null){let c=editId?data.cycles.find(x=>x.id===editId):null;document.getElementById('modal').innerHTML=`<div class="modalhead"><h3>${c?'تعديل الدورة':'تسجيل دورة جديدة'}</h3><button class="close" onclick="closeModal()">×</button></div><div class="formgrid"><div class="field"><label>تاريخ البداية</label><input id="cycleStart" type="date" value="${c?.start||todayKey()}"></div><div class="field"><label>تاريخ النهاية (إن انتهت)</label><input id="cycleEnd" type="date" value="${c?.end||''}"></div><div class="field"><label>مستوى النزيف</label><select id="cycleFlow"><option value="خفيف" ${c?.flow==='خفيف'?'selected':''}>خفيف</option><option value="متوسط" ${!c||c.flow==='متوسط'?'selected':''}>متوسط</option><option value="غزير" ${c?.flow==='غزير'?'selected':''}>غزير</option></select></div><div class="field"><label>ملاحظة</label><input id="cycleNotes" value="${escapeHtml(c?.notes||'')}" placeholder="اختياري"></div></div><div class="modal-actions"><button class="btn" onclick="saveCycle('${editId||''}')">حفظ</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div>`;document.getElementById('modalBack').classList.add('open')}function closeModal(){document.getElementById('modalBack').classList.remove('open')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveCycle(id){let start=document.getElementById('cycleStart').value,end=document.getElementById('cycleEnd').value;if(!start)return toast('أضيفي تاريخ بداية الدورة');if(end&&end<start)return toast('تاريخ النهاية يجب ألا يسبق البداية');if(end&&new Date(end)-new Date(start)>20*86400000)return toast('راجعي تاريخ نهاية الدورة');if(id){let x=data.cycles.find(c=>c.id===id);Object.assign(x,{start,end,flow:document.getElementById('cycleFlow').value,notes:document.getElementById('cycleNotes').value})}else data.cycles.push({id:crypto.randomUUID(),start,end,flow:document.getElementById('cycleFlow').value,notes:document.getElementById('cycleNotes').value});data.cycles.sort((a,b)=>a.start.localeCompare(b.start));persist();closeModal();nav('home')}
function analyticsPage(c){let logs=allLogs().slice(-90),moodCounts={},symCounts={},painPoints=[],energy=[];logs.forEach(([d,l])=>{if(l.mood)moodCounts[l.mood]=(moodCounts[l.mood]||0)+1;(l.symptoms||[]).forEach(s=>symCounts[s]=(symCounts[s]||0)+1);if(l.pain!=null)painPoints.push({d:d,v:l.pain});if(l.energy)energy.push({d:d,v:['منخفض جدًا','منخفض','متوسط','مرتفع','مرتفع جدًا'].indexOf(l.energy)+1})});let topSym=Object.entries(symCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);let topMood=Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0];let avgPain=painPoints.length?(painPoints.reduce((a,b)=>a+b.v,0)/painPoints.length).toFixed(1):'—';c.innerHTML=`<h1 class="page-title">التحليلات</h1><p class="page-sub">ملخص مستمد من تسجيلاتك فقط؛ لا يمثل تشخيصًا طبيًا.</p><div class="grid mini-grid"><div class="metric"><div class="metriclabel">متوسط الألم المسجل</div><div class="metricvalue">${avgPain}<small style="font-size:12px"> / 10</small></div><div class="metricfoot">من ${painPoints.length} سجل</div></div><div class="metric"><div class="metriclabel">المزاج الأكثر تسجيلًا</div><div class="metricvalue" style="font-size:18px">${topMood?.[0]||'—'}</div><div class="metricfoot">${topMood?.[1]||0} تسجيل</div></div><div class="metric"><div class="metriclabel">عدد الأعراض المميزة</div><div class="metricvalue">${Object.keys(symCounts).length}</div><div class="metricfoot">حسب تسجيلاتك</div></div><div class="metric"><div class="metriclabel">سجلات آخر 90 يومًا</div><div class="metricvalue">${logs.length}</div><div class="metricfoot">يوميات محفوظة</div></div></div><div class="sectionhead"><h2>تغير الألم</h2><span>آخر 30 سجلًا</span></div><div class="card chartbox"><canvas id="painChart"></canvas></div><div class="sectionhead"><h2>الأعراض الأكثر تكرارًا</h2><span>آخر 90 يومًا</span></div><div class="card">${topSym.length?topSym.map(([s,n])=>`<div class="listrow"><div class="listicon">✧</div><div class="listmain"><b>${s}</b><small>${n} يومًا</small></div><div class="listright">${Math.round(n/Math.max(1,logs.length)*100)}%</div></div>`).join(''):`<div class="empty">سجّلي أعراضك حتى تظهر التحليلات هنا.</div>`}</div><div class="sectionhead"><h2>ملاحظة لطيفة</h2></div><div class="card" style="background:#f7edf5;color:#8d6982;font-size:12px;line-height:1.9">${topMood?`في سجلاتك، المزاج الأكثر تكرارًا هو «${topMood[0]}». هذه مجرد ملاحظة من البيانات المدخلة، وليست علاقة سببية.`:'كل تسجيل صغير يساعدك على ملاحظة الأنماط بمرور الوقت. لا توجد بيانات كافية لتحليلها بعد.'}</div>`;drawPainChart(painPoints.slice(-30))}
function drawPainChart(points){let canvas=document.getElementById('painChart');if(!canvas)return;let ctx=canvas.getContext('2d'),w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);w/=devicePixelRatio;h/=devicePixelRatio;let pad=28;ctx.font='10px Alexandria';ctx.strokeStyle='#f0e5ec';ctx.fillStyle='#9b8b9c';ctx.lineWidth=1;for(let i=0;i<=10;i+=2){let y=h-pad-(i/10)*(h-2*pad);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();ctx.fillText(i,pad-17,y+3)}if(points.length<2){ctx.fillStyle='#aa91a5';ctx.fillText('أضيفي المزيد من السجلات لعرض الرسم',pad+8,h/2);return}let max=Math.max(1,points.length-1);ctx.beginPath();points.forEach((p,i)=>{let x=pad+i/max*(w-2*pad),y=h-pad-p.v/10*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#c66d94';ctx.lineWidth=2.5;ctx.stroke();points.forEach((p,i)=>{let x=pad+i/max*(w-2*pad),y=h-pad-p.v/10*(h-2*pad);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fillStyle='#c66d94';ctx.fill()})}
function historyPage(c){let cycles=[...data.cycles].sort((a,b)=>b.start.localeCompare(a.start));c.innerHTML=`<h1 class="page-title">سجل الدورات</h1><p class="page-sub">تاريخك المسجل يساعدك على ملاحظة التغيرات عبر الوقت.</p><div class="card">${cycles.length?cycles.map((x,i)=>{let days=x.end?Math.round((new Date(x.end+'T12:00:00')-new Date(x.start+'T12:00:00'))/86400000)+1:'—';let next=cycles[i+1],len=next?Math.round((new Date(x.start+'T12:00:00')-new Date(next.start+'T12:00:00'))/86400000):'—';return `<div class="listrow"><div class="listicon">◷</div><div class="listmain"><b>${dateFmt(new Date(x.start+'T12:00:00'))}</b><small>${x.end?'مدة النزيف: '+days+' أيام':'الدورة مستمرة / لم تحدد النهاية'} · ${x.flow||'—'}</small><small>طول الدورة حتى السابقة: ${len==='—'?'—':len+' يومًا'}</small>${x.notes?`<small>${escapeHtml(x.notes)}</small>`:''}</div><div class="listright"><button class="pill" onclick="openCycleModal('${x.id}')">تعديل</button><button class="pill" onclick="deleteCycle('${x.id}')">حذف</button></div></div>`}).join(''):`<div class="empty"><h3>لا توجد دورات مسجلة</h3>سجّلي بداية الدورة لبدء سجلّك الخاص.</div>`}</div><div style="margin-top:15px"><button class="btn" onclick="openCycleModal()">＋ تسجيل دورة</button></div>`}function deleteCycle(id){if(confirm('هل تريدين حذف هذا التسجيل؟')){data.cycles=data.cycles.filter(x=>x.id!==id);persist();render()}}
function wellnessPage(c){c.innerHTML=`<h1 class="page-title">Your Wellness Space</h1><p class="page-sub">معلومات بسيطة، مساحة للتعلم والاهتمام بنفسك.</p><div class="grid wellnessgrid">${articles.map((a,i)=>`<div class="card article" onclick="articleModal(${i})"><span class="arttag">WELLNESS · 0${i+1}</span><h3>${a[1]}</h3><p>${a[2].slice(0,85)}…</p><button class="pill">اقرئي المزيد ←</button></div>`).join('')}</div>`}function articleModal(i){let a=articles[i];document.getElementById('modal').innerHTML=`<div class="modalhead"><h3>${a[1]}</h3><button class="close" onclick="closeModal()">×</button></div><p style="font-size:12px;line-height:2;color:var(--muted)">${a[2]}</p><div class="modal-actions"><button class="btn" onclick="closeModal()">حسنًا</button></div>`;document.getElementById('modalBack').classList.add('open')}
function profilePage(c){c.innerHTML=`<h1 class="page-title">الإعدادات والخصوصية</h1><p class="page-sub">إدارة مساحتك، تفضيلاتك، وبياناتك.</p><div class="card"><div class="field"><label>الاسم أو اللقب</label><input id="profileName" value="${escapeHtml(data.profile?.name||'')}" placeholder="كيف نناديك؟"></div><div class="modal-actions"><button class="btn" onclick="saveProfile()">حفظ الملف</button><button class="btn secondary" onclick="lockApp()">قفل التطبيق</button></div></div><div class="sectionhead"><h2>الخصوصية والبيانات</h2></div><div class="card"><div class="listrow"><div class="listicon">⌑</div><div class="listmain"><b>تخزين محلي</b><small>تُحفظ نسخة محلية، وتتم مزامنة نسخة سحابية مشفرة تلقائيًا عند فتح التطبيق بكلمة المرور.</small></div></div><div class="listrow"><div class="listicon">⇩</div><div class="listmain"><b>تصدير بياناتك</b><small>تنزيل نسخة JSON من الدورات والسجلات.</small></div><button class="pill" onclick="exportData()">تصدير</button></div><div class="listrow"><div class="listicon">⌫</div><div class="listmain"><b>حذف جميع البيانات</b><small>حذف الدورات والسجلات المخزنة على هذا الجهاز نهائيًا.</small></div><button class="pill" style="color:#bc5f79" onclick="wipeData()">حذف</button></div></div><div class="sectionhead"><h2>المزامنة السحابية</h2></div><div class="card"><div class="listrow"><div class="listicon">↻</div><div class="listmain"><b>Firebase Realtime Database</b><small id="syncStatus">المزامنة مفعلة بعد إدخال كلمة المرور في شاشة الدخول.</small></div></div><p style="font-size:10px;color:var(--muted);line-height:1.9">قاعدة البيانات مثبتة داخل التطبيق. يتم تشفير سجلّك بكلمة المرور قبل إرساله إلى Firebase، وتُسترجع البيانات تلقائيًا عند الدخول من جهاز آخر بنفس كلمة المرور. </p><button class="btn secondary" onclick="manualSync()">مزامنة الآن</button></div><div class="sectionhead"><h2>حول Z4L</h2></div><div class="card" style="font-size:11px;color:var(--muted);line-height:1.9"><b style="color:var(--ink)">Z4L · Your body. Your rhythm. Your space.</b><br>التوقعات المعروضة تقديرية وليست وسيلة لمنع الحمل أو تشخيص حالة طبية. بيانات السحابة مشفرة، لكن قواعد Firebase في هذه النسخة التجريبية تحتاج تقوية قبل حفظ معلومات صحية حساسة.</div>`}function manualSync(){if(!syncState.active)return toast('افتحي التطبيق بكلمة المرور أولًا');cloudWrite();toast('جارٍ مزامنة البيانات ♡')}
function saveProfile(){data.profile.name=document.getElementById('profileName').value;persist();toast('تم حفظ الملف')}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='z4l-my-data.json';a.click();URL.revokeObjectURL(url);toast('تم تجهيز ملف التصدير')}function wipeData(){if(confirm('حذف كل الدورات والسجلات والإعدادات؟ لا يمكن التراجع.')){data={cycles:[],logs:{},reminders:[],profile:{name:''}};persist();nav('home')}}
// Keep navigation event delegation for buttons inserted later.
window.nav=nav;window.openCycleModal=openCycleModal;window.closeModal=closeModal;window.saveCycle=saveCycle;window.deleteCycle=deleteCycle;window.changeMonth=changeMonth;window.selectCalendarDay=selectCalendarDay;window.pickMood=pickMood;window.toggleSymptom=toggleSymptom;window.saveJournal=saveJournal;window.stageInfo=stageInfo;window.articleModal=articleModal;window.saveProfile=saveProfile;window.exportData=exportData;window.wipeData=wipeData;window.manualSync=manualSync;
// Modal outside click closes it.
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});

</script></body></html>
